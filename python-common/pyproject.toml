[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "judgment-common"
version = "1.0.0"
description = "Shared providers, guardrails and models for Judgment Analyzer"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "pydantic-settings>=2.2,<3", "fastapi>=0.111,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[project.optional-dependencies]
db = ["sqlalchemy>=2.0,<3", "asyncpg>=0.29,<1"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
