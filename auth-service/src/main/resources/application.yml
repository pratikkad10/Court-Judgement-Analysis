server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/judgment_analyzer}
    username: ${SPRING_DATASOURCE_USERNAME:judgment}
    password: ${SPRING_DATASOURCE_PASSWORD:judgment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:}
  internal-key: ${INTERNAL_SERVICE_KEY:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  access-minutes: 15
  refresh-days: 7
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlation_id=%X{correlationId:-missing} %logger - %msg%n"
